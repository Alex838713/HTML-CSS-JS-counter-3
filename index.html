<!DOCTYPE html>
<html>
    <head>
        <title>Interactive To-do list</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
        <div class="card">
        <h1>To-Do list</h1>
        <p>To add tasks click the button and for finished tasks click on the task</p>
        <input type="text" id="task list" username="Task list" placeholder="enter new task"/>
        <button id="add-btn">Add</button>
        <ul id="list">
            <li id="Task">0</li>
        </ul>
        </div>
    </div>
    <script src="script.js"></script>
    </body>
</html>
